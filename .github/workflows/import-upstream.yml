name: Import upstream snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import public-apis snapshot excluding workflows
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/public-apis/public-apis.git || true
          git fetch --depth=1 upstream 7ee71f04dd42720f7f4130aa70f804aa95c53164
          tmpdir="$(mktemp -d)"
          git archive FETCH_HEAD | tar -x -C "$tmpdir"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name 'workflows' -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name 'import-upstream.yml' -exec rm -rf {} +
          rsync -a --exclude='.github/workflows/' "$tmpdir"/ ./
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import public-apis snapshot 7ee71f04dd42720f7f4130aa70f804aa95c53164"
          git push origin HEAD:main
